name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 17:00 UTC = 01:00 SGT, one hour before the nightly sync timer.
    # Catches upstream data.gov.sg changes before the sync runs.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run end-to-end tests against the deployed app"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: IaC - fmt, validate, lint, scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        # Diagnostics are turned into annotations so they show on the commit and PR.
        run: |
          terraform validate -json > validate.json || true
          jq -r '.diagnostics[] |
            "::\(if .severity == "error" then "error" else "warning" end) file=infra/terraform/\(.range.filename // "main.tf"),line=\(.range.start.line // 1)::\(.summary): \(.detail // "")"' validate.json
          jq -e '.valid' validate.json > /dev/null

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --format compact

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          config_file: infra/terraform/.checkov.yaml
          output_format: cli

  contract-tests:
    name: Tests - fixtures and data.gov.sg contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contract
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14

  e2e-tests:
    name: Tests - end-to-end
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: contract-tests
    runs-on: ubuntu-latest
    environment: personal-env
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --project=setup --project=e2e
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          OFFICER_USERNAME: ${{ vars.OFFICER_USERNAME }}
          OFFICER_PASSWORD: ${{ secrets.OFFICER_PASSWORD }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14
